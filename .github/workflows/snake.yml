name: Generate Arwa's golden star trail

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution trail
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#E8C18D&color_dots=#2B2027,#5A3947,#946276,#C99469,#F2D7AD

      - name: Turn the moving snake into golden starbursts
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          file = Path("dist/snake.svg")
          svg = file.read_text(encoding="utf-8")

          pattern = re.compile(r'<rect class="s s([0-3])"([^>]*)/>')

          def star(match):
              attrs = match.group(2)
              values = dict(re.findall(r'(x|y|width|height)="([^"]+)"', attrs))
              x, y = float(values["x"]), float(values["y"])
              w, h = float(values["width"]), float(values["height"])
              cx, cy = x + w / 2, y + h / 2
              ix, iy = w * 0.23, h * 0.23
              points = [
                  (cx, y), (cx + ix, cy - iy), (x + w, cy),
                  (cx + ix, cy + iy), (cx, y + h),
                  (cx - ix, cy + iy), (x, cy), (cx - ix, cy - iy)
              ]
              d = "M " + " L ".join(f"{px:.2f} {py:.2f}" for px, py in points) + " Z"
              return f'<path class="s s{match.group(1)}" d="{d}"/>'

          svg, count = pattern.subn(star, svg)
          if count == 0:
              raise SystemExit("No animated snake segments found; refusing to publish an unchanged image.")

          # Fill the growing trail with repeating tiny stars, while the moving head
          # becomes a larger four-point sparkle.
          patterns = """
          <defs>
            <pattern id="trailRose" patternUnits="userSpaceOnUse" width="16" height="12"><path d="M8 1 L9.7 5 L15 6 L9.7 7 L8 11 L6.3 7 L1 6 L6.3 5 Z" fill="#E8C18D"/></pattern>
            <pattern id="trailChampagne" patternUnits="userSpaceOnUse" width="16" height="12"><path d="M8 1 L9.7 5 L15 6 L9.7 7 L8 11 L6.3 7 L1 6 L6.3 5 Z" fill="#F2D7AD"/></pattern>
            <pattern id="trailDusty" patternUnits="userSpaceOnUse" width="16" height="12"><path d="M8 1 L9.7 5 L15 6 L9.7 7 L8 11 L6.3 7 L1 6 L6.3 5 Z" fill="#C99469"/></pattern>
            <pattern id="trailBlush" patternUnits="userSpaceOnUse" width="16" height="12"><path d="M8 1 L9.7 5 L15 6 L9.7 7 L8 11 L6.3 7 L1 6 L6.3 5 Z" fill="#DDA9A0"/></pattern>
          </defs>
          """
          svg = svg.replace("<style>", patterns + "<style>", 1)
          svg = svg.replace("</style>", ".u.u0{fill:url(#trailRose)}.u.u1{fill:url(#trailChampagne)}.u.u2{fill:url(#trailDusty)}.u.u3{fill:url(#trailBlush)}</style>", 1)
          file.write_text(svg, encoding="utf-8")
          print(f"Converted {count} moving head layers and added a repeating star trail.")
          PY

      - name: Publish animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
