<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
<title id="t">Arwa's Skill Constellation</title><desc id="d">A fine-line astronomical star map on a midnight sky, mapping software engineering skills.</desc>
<defs><radialGradient id="space"><stop stop-color="#10192b"/><stop offset=".65" stop-color="#070d1a"/><stop offset="1" stop-color="#030711"/></radialGradient><radialGradient id="cloud"><stop stop-color="#743044" stop-opacity=".3"/><stop offset="1" stop-color="#743044" stop-opacity="0"/></radialGradient><linearGradient id="gold"><stop stop-color="#fff1d0"/><stop offset=".5" stop-color="#d4b47c"/><stop offset="1" stop-color="#92704d"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8"/></filter></defs>
<style>
 text{font-family:Arial,Helvetica,sans-serif}.title{font-family:Georgia,serif;font-size:34px;letter-spacing:5px;fill:#fff1dd}.eyebrow{font-size:12px;letter-spacing:4px;fill:#c8ad83}.label{font-size:16px;letter-spacing:2px;fill:#ead5ad}.tech{font-size:14px;fill:#e9dfd0}.wire{fill:none;stroke:#d6b77d;stroke-width:1.1;stroke-opacity:.53}.soft{fill:none;stroke:#d6b77d;stroke-width:.8;stroke-opacity:.24}.star{fill:#fff0c9;animation:tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d1{animation-delay:1s}.d2{animation-delay:2s}@keyframes tw{0%,100%{opacity:.35;transform:scale(.75)}50%{opacity:1;transform:scale(1.5)}}.node{fill:#0b1322;fill-opacity:.75;stroke:#c9a675;stroke-opacity:.65;stroke-width:1.1}
</style>
<rect width="1200" height="700" fill="url(#space)"/>
<ellipse cx="260" cy="300" rx="260" ry="150" fill="url(#cloud)" filter="url(#glow)"/><ellipse cx="900" cy="360" rx="300" ry="170" fill="url(#cloud)" filter="url(#glow)"/>
<g fill="#e8d8bc"><circle cx="65" cy="80" r="1.2"/><circle cx="160" cy="330" r="1"/><circle cx="320" cy="90" r="1.3"/><circle cx="470" cy="160" r="1"/><circle cx="730" cy="85" r="1.2"/><circle cx="1090" cy="90" r="1.1"/><circle cx="1140" cy="520" r="1.3"/><circle cx="70" cy="570" r="1.1"/><circle cx="400" cy="600" r="1.2"/><circle cx="820" cy="620" r="1.1"/></g>
<text x="600" y="54" text-anchor="middle" class="eyebrow">A PERSONAL MAP OF WHAT I'M LEARNING</text><text x="600" y="105" text-anchor="middle" class="title">THE SKILL CONSTELLATION</text>
<g class="wire">
<path d="M600 350L220 230 130 130 300 115 220 230 360 430 600 350 980 230 1080 130 900 115 980 230 840 430 600 350 600 555"/>
<path d="M300 115L475 220 600 350 725 220 900 115M360 430L460 560 600 555 740 560 840 430"/>
<path d="M130 130L220 230L360 430M1080 130L980 230L840 430"/>
</g><g class="soft"><path d="M220 230L475 220L725 220L980 230M360 430L600 350L840 430M460 560L600 555L740 560"/></g>
<!-- frontend -->
<g><circle class="node" cx="220" cy="230" r="93"/><text x="220" y="205" text-anchor="middle" class="label">FRONTEND</text><text x="220" y="235" text-anchor="middle" class="tech">HTML · CSS</text><text x="220" y="260" text-anchor="middle" class="tech">JavaScript · React</text><path class="star" d="M220 115l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/></g>
<!-- backend -->
<g><circle class="node" cx="980" cy="230" r="93"/><text x="980" y="205" text-anchor="middle" class="label">BACKEND</text><text x="980" y="235" text-anchor="middle" class="tech">Node.js · Express</text><text x="980" y="260" text-anchor="middle" class="tech">C · Java</text><path class="star d1" d="M980 115l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/></g>
<!-- database -->
<g><circle class="node" cx="360" cy="430" r="69"/><text x="360" y="425" text-anchor="middle" class="label">DATABASE</text><text x="360" y="451" text-anchor="middle" class="tech">MongoDB</text><path class="star d2" d="M360 342l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/></g>
<!-- tools -->
<g><circle class="node" cx="840" cy="430" r="69"/><text x="840" y="425" text-anchor="middle" class="label">DEV TOOLS</text><text x="840" y="451" text-anchor="middle" class="tech">Linux · Git</text><path class="star d1" d="M840 342l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/></g>
<!-- center -->
<g><circle cx="600" cy="350" r="115" fill="#d5ae75" opacity=".09" filter="url(#glow)"/><circle cx="600" cy="350" r="76" fill="#09111e" stroke="#e0c18a" stroke-opacity=".65"/><path d="M600 285l13 37 37 13-37 13-13 37-13-37-37-13 37-13z" fill="url(#gold)"/><text x="600" y="410" text-anchor="middle" class="label">SOFTWARE</text><text x="600" y="431" text-anchor="middle" class="tech">ENGINEERING</text></g>
<!-- mobile -->
<g><circle class="node" cx="600" cy="555" r="63"/><text x="600" y="550" text-anchor="middle" class="label">MOBILE</text><text x="600" y="575" text-anchor="middle" class="tech">Swift</text><path class="star d2" d="M600 472l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/></g>
<g><circle class="star" cx="130" cy="130" r="2.5"/><circle class="star d1" cx="300" cy="115" r="2.3"/><circle class="star d2" cx="475" cy="220" r="2.3"/><circle class="star" cx="725" cy="220" r="2.3"/><circle class="star d1" cx="900" cy="115" r="2.3"/><circle class="star d2" cx="1080" cy="130" r="2.5"/><circle class="star" cx="460" cy="560" r="2"/><circle class="star d1" cx="740" cy="560" r="2"/></g>
<text x="600" y="665" text-anchor="middle" class="eyebrow">EVERY SKILL HAS A PLACE IN THE SKY  ✦  STILL GROWING</text>
</svg>