<text x="55" y="145" fill="#FFF1E2" font-size="24" class="rise">Arwa Alhomrani</text>
<text x="55" y="174" fill="#D9B477" font-size="14">Software Engineering Student · Holberton</text>
<text x="55" y="222" fill="#D9B477" font-size="15">$ current_focus</text>
<text x="55" y="252" fill="#F7EBDD" font-size="16">Software Engineering · Full-Stack Development</text>
<text x="55" y="280" fill="#F7EBDD" font-size="16">Backend · APIs · Databases · Clean Code</text>
