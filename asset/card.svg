<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430">
<defs>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#281923"/><stop offset="1" stop-color="#432A38"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F7E6BF"/><stop offset=".5" stop-color="#C89B68"/><stop offset="1" stop-color="#F7E6BF"/></linearGradient>
