<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440">
<defs>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#21171D"/><stop offset="1" stop-color="#4B2C3A"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FFF0D0"/><stop offset=".5" stop-color="#C99469"/><stop offset="1" stop-color="#F7E3BE"/></linearGradient>
</defs>
<style>
 text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
 .tw{transform-box:fill-box;transform-origin:center;animation:tw 2.7s ease-in-out infinite}
 .blink{animation:blink 1.1s steps(1) infinite}
 .rise{animation:rise .8s ease both}
 .orbit{transform-origin:805px 258px;animation:spin 38s linear infinite}
 @keyframes tw{0%,100%{opacity:.22;transform:scale(.65)}50%{opacity:1;transform:scale(1.25)}}
 @keyframes blink{50%{opacity:0}}
 @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
 @keyframes spin{to{transform:rotate(360deg)}}
</style>
<rect x="2" y="2" width="996" height="436" rx="22" fill="url(#panel)" stroke="#C99469" stroke-width="1.8"/>
<rect x="15" y="15" width="970" height="410" rx="16" fill="none" stroke="#E8C18E" stroke-opacity=".22"/>
<path d="M20 67H980" stroke="#C99469" stroke-opacity=".5"/>
<circle cx="43" cy="42" r="5.5" fill="#D68FA5"/><circle cx="63" cy="42" r="5.5" fill="#D9B477"/><circle cx="83" cy="42" r="5.5" fill="#F5E8D0"/>
<text x="500" y="47" fill="#EAD6BC" font-size="13" text-anchor="middle" letter-spacing="2">ARWA@CELESTIAL-DEV  ·  PROFILE.SYS</text>
