<style>
 text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
 .tw{transform-box:fill-box;transform-origin:center;animation:tw 3s ease-in-out infinite}
 .blink{animation:blink 1.1s steps(1) infinite}
 .line{animation:appear .7s ease both}
 @keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}
 @keyframes blink{50%{opacity:0}}
 @keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
</style>
