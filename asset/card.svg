<text x="58" y="62" font-size="12" letter-spacing="4" fill="#c8aa79">01  /  THE PERSON BEHIND THE CODE</text>
<text x="58" y="118" class="serif" font-size="37" fill="#fff2df">Engineering ideas into reality.</text>
<text x="58" y="158" font-size="17" fill="#e3d5c3">Software Engineering student at Holberton</text>
