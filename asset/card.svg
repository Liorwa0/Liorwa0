<text x="55" y="360" fill="#F7EBDD" font-size="15">C  /  JavaScript  /  Python  /  Java  /  Swift</text>
<text x="55" y="389" fill="#F7EBDD" font-size="15">React  /  Node.js  /  MongoDB  /  Linux  /  Git</text>
<text x="55" y="414" fill="#D9B477" font-size="13">Building thoughtfully, one commit at a time.</text>
