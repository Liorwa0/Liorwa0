<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#281923"/><stop offset=".52" stop-color="#593344"/><stop offset="1" stop-color="#9A6574"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#F8DCA8" stop-opacity=".34"/><stop offset="1" stop-color="#F8DCA8" stop-opacity="0"/></radialGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF0C9"/><stop offset=".45" stop-color="#D9B477"/><stop offset="1" stop-color="#A8754E"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
 .tw{transform-box:fill-box;transform-origin:center;animation:twinkle 2.8s ease-in-out infinite}
 .float{animation:float 7s ease-in-out infinite}
 .shine{animation:shine 5s ease-in-out infinite}
 @keyframes twinkle{0%,100%{opacity:.28;transform:scale(.68) rotate(0)}50%{opacity:1;transform:scale(1.22) rotate(18deg)}}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
 @keyframes shine{0%,100%{opacity:.12}50%{opacity:.55}}
 .mono{font-family:Georgia,'Times New Roman',serif}
</style>
<rect width="1000" height="300" rx="22" fill="url(#bg)"/>
<circle cx="500" cy="135" r="270" fill="url(#glow)"/>
<circle cx="500" cy="135" r="190" fill="url(#glow)" opacity=".5"/>
<g fill="url(#gold)">
