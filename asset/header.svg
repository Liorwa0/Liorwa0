 <path class="tw" style="animation-delay:.7s" d="M230 190l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
 <path class="tw" style="animation-delay:1.1s" d="M850 54l6 16 16 6-16 6-6 16-6-16-16-6 16-6z"/>
 <path class="tw" style="animation-delay:1.6s" d="M915 205l4 11 11 4-11 4-4 11-4-11-11-4 11-4z"/>
 <path class="tw" style="animation-delay:.3s" d="M700 230l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
 <path class="tw" style="animation-delay:1.9s" d="M370 62l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
</g>
<g fill="#FBE8C6">
 <circle cx="160" cy="125" r="2"/><circle cx="310" cy="38" r="2"/><circle cx="760" cy="115" r="2"/><circle cx="640" cy="250" r="2"/><circle cx="80" cy="245" r="2"/><circle cx="940" cy="130" r="2"/>
</g>
<g class="float" transform="translate(500 72)">
 <path d="M0 -29l7 22 22 7-22 7L0 29-7 7l-22-7 22-7z" fill="url(#gold)" opacity=".9"/>
 <circle r="43" fill="none" stroke="#E8C99A" stroke-opacity=".45"/>
 <circle r="55" fill="none" stroke="#E8C99A" stroke-opacity=".2" stroke-dasharray="2 9"/>
</g>
<text x="500" y="166" text-anchor="middle" class="mono" font-size="58" letter-spacing="5" fill="#FFF5E8">ARWA ALHOMRANI</text>
<text x="500" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" letter-spacing="5" fill="#E9C99D">SOFTWARE ENGINEER IN THE MAKING</text>
<path d="M350 232H650" stroke="url(#gold)" stroke-width="1" opacity=".7"/>
<text x="500" y="260" text-anchor="middle" font-family="Georgia,serif" font-size="13" letter-spacing="3" fill="#F4DDBB">✧ CURIOSITY  ·  CRAFT  ·  CONSTELLATIONS ✧</text>
</svg>