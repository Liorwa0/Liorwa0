<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310">
<defs>
 <linearGradient id="velvet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1D151A"/><stop offset=".48" stop-color="#422632"/><stop offset="1" stop-color="#704452"/></linearGradient>
 <linearGradient id="roseGold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF2D2"/><stop offset=".35" stop-color="#E9C18D"/><stop offset=".72" stop-color="#B98267"/><stop offset="1" stop-color="#F7DDAF"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#E9BFA0" stop-opacity=".28"/><stop offset="1" stop-color="#E9BFA0" stop-opacity="0"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
 .star{fill:url(#roseGold);transform-box:fill-box;transform-origin:center;animation:twinkle 2.8s ease-in-out infinite}
 .s1{animation-delay:.4s}.s2{animation-delay:1.1s}.s3{animation-delay:1.8s}.s4{animation-delay:2.2s}.s5{animation-delay:.9s}
 .float{animation:float 6s ease-in-out infinite}
 .orbit{transform-origin:500px 116px;animation:orbit 32s linear infinite}
 .meteor{stroke:url(#roseGold);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:2 80;animation:shoot 7s linear infinite;opacity:0}
 .meteor.m2{animation-delay:3.5s}
 @keyframes twinkle{0%,100%{opacity:.22;transform:scale(.58) rotate(0)}50%{opacity:1;transform:scale(1.25) rotate(18deg)}}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
 @keyframes orbit{to{transform:rotate(360deg)}}
 @keyframes shoot{0%{opacity:0;stroke-dashoffset:0}8%{opacity:.9}24%{opacity:0;stroke-dashoffset:-120}100%{opacity:0;stroke-dashoffset:-120}}
 .serif{font-family:Georgia,'Times New Roman',serif}
</style>
<rect width="1000" height="310" rx="24" fill="url(#velvet)"/>
<rect x="10" y="10" width="980" height="290" rx="18" fill="none" stroke="url(#roseGold)" stroke-opacity=".48"/>
<rect x="17" y="17" width="966" height="276" rx="14" fill="none" stroke="#F3D7B8" stroke-opacity=".13"/>
<circle cx="500" cy="132" r="300" fill="url(#halo)"/>
<circle cx="500" cy="132" r="190" fill="url(#halo)" opacity=".65"/>
<g class="orbit" fill="none" stroke="#E9C18D" stroke-opacity=".24"><ellipse cx="500" cy="118" rx="240" ry="74"/><ellipse cx="500" cy="118" rx="280" ry="94" stroke-dasharray="2 9"/></g>
<g>
 <path class="star" d="M92 54l6 16 16 6-16 6-6 16-6-16-16-6 16-6z"/>
