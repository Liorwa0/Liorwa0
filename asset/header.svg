 <path class="star s4" d="M755 248l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
 <path class="star s5" d="M326 55l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
 <path class="star s2" d="M680 64l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
 <path class="star s1" d="M120 148l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
</g>
<g fill="#F8E5C8"><circle cx="160" cy="108" r="1.8"/><circle cx="278" cy="250" r="1.5"/><circle cx="390" cy="40" r="1.4"/><circle cx="626" cy="255" r="1.6"/><circle cx="790" cy="135" r="1.5"/><circle cx="940" cy="132" r="1.5"/><circle cx="58" cy="244" r="1.5"/></g>
<path class="meteor" d="M730 30L610 150"/><path class="meteor m2" d="M350 22L245 127"/>
<g class="float" filter="url(#glow)">
 <path d="M500 54l10 29 29 10-29 10-10 29-10-29-29-10 29-10z" fill="url(#roseGold)"/>
 <circle cx="500" cy="93" r="53" fill="none" stroke="#F0D4AA" stroke-opacity=".48"/>
</g>
<text x="500" y="184" text-anchor="middle" class="serif" font-size="56" letter-spacing="5" fill="#FFF5E9">ARWA ALHOMRANI</text>
<text x="500" y="222" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" letter-spacing="5" fill="#E9C18D">SOFTWARE ENGINEER IN THE MAKING</text>
