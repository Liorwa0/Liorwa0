<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="t d">
<title id="t">Arwa Alhomrani — Software Engineer</title><desc id="d">A midnight astronomical sky with delicate champagne-gold constellations and a subtle burgundy nebula.</desc>
<defs>
 <radialGradient id="space"><stop stop-color="#10182a"/><stop offset=".62" stop-color="#080d1b"/><stop offset="1" stop-color="#030711"/></radialGradient>
 <radialGradient id="nebula"><stop stop-color="#713044" stop-opacity=".34"/><stop offset=".42" stop-color="#492033" stop-opacity=".18"/><stop offset="1" stop-color="#1a1020" stop-opacity="0"/></radialGradient>
 <linearGradient id="metal"><stop stop-color="#fff2cf"/><stop offset=".45" stop-color="#d8b77b"/><stop offset="1" stop-color="#98734c"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
 <filter id="shine"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
 .wire{fill:none;stroke:#d5b77f;stroke-width:1;stroke-opacity:.43}
 .pin{fill:#fff0c9;filter:url(#shine)}
 .tiny{fill:#e8d7b4;opacity:.7}
 .pulse{animation:pulse 3.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 .p2{animation-delay:1.2s}.p3{animation-delay:2.1s}
 .meteor{stroke:url(#metal);stroke-width:1.2;stroke-dasharray:2 95;animation:meteor 9s linear infinite;opacity:0}
 .m2{animation-delay:4.5s}
 @keyframes pulse{0%,100%{opacity:.35;transform:scale(.72)}50%{opacity:1;transform:scale(1.5)}}
 @keyframes meteor{0%{opacity:0;stroke-dashoffset:0}8%{opacity:.8}22%{opacity:0;stroke-dashoffset:-150}100%{opacity:0;stroke-dashoffset:-150}}
</style>
<rect width="1200" height="390" fill="url(#space)"/>
<ellipse cx="260" cy="190" rx="260" ry="115" fill="url(#nebula)" filter="url(#blur)"/>
<ellipse cx="850" cy="235" rx="330" ry="130" fill="url(#nebula)" filter="url(#blur)"/>
<ellipse cx="600" cy="85" rx="210" ry="80" fill="url(#nebula)" filter="url(#blur)" opacity=".55"/>
