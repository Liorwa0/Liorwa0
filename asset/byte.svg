<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260">
<defs><linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#362331"/><stop offset=".55" stop-color="#6B4355"/><stop offset="1" stop-color="#B47B88"/></linearGradient><linearGradient id="moon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF1CB"/><stop offset="1" stop-color="#C99A62"/></linearGradient></defs>
<style>
 .tw{transform-box:fill-box;transform-origin:center;animation:tw 2.7s ease-in-out infinite}
 .drift{animation:drift 9s ease-in-out infinite}
 .pulse{animation:pulse 4s ease-in-out infinite}
 @keyframes tw{0%,100%{opacity:.2;transform:scale(.65) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(20deg)}}
 @keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(16px)}}
 @keyframes pulse{0%,100%{opacity:.4}50%{opacity:.95}}
</style>
<rect width="1000" height="260" rx="20" fill="url(#night)" stroke="#C99A62" stroke-width="2"/>
<circle cx="800" cy="100" r="78" fill="#F5DDAE" opacity=".12" class="pulse"/>
<path d="M820 38a62 62 0 1 0 48 102 66 66 0 0 1-48-102" fill="url(#moon)"/>
<g fill="#F7E3B9">
 <path class="tw" d="M120 42l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/>
 <path class="tw" style="animation-delay:.8s" d="M300 170l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
 <path class="tw" style="animation-delay:1.4s" d="M690 50l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
 <path class="tw" style="animation-delay:.4s" d="M940 190l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
 <path class="tw" style="animation-delay:1.8s" d="M520 205l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
</g>
<g fill="#FFECCF"><circle cx="205" cy="85" r="2"/><circle cx="405" cy="50" r="2"/><circle cx="610" cy="135" r="2"/><circle cx="920" cy="55" r="2"/><circle cx="80" cy="205" r="2"/></g>
<path d="M65 220Q250 170 440 215T760 210T970 215" fill="none" stroke="#E8C99A" stroke-opacity=".5"/>
<g class="drift" fill="none" stroke="#E8C99A" stroke-width="1.2" opacity=".65"><path d="M140 110l45 -25 38 30 42 -44 42 25"/><path d="M185 85l0 -9m38 39l7 9m42 -53l-4 -8"/></g>
<text x="500" y="115" text-anchor="middle" font-family="Georgia,serif" font-size="27" letter-spacing="4" fill="#FFF1E2">A LITTLE STARDUST, A LOT OF CODE</text>
<text x="500" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" letter-spacing="4" fill="#F2D6B2">MADE WITH CURIOSITY  ✧  BUILT WITH PURPOSE</text>
</svg>