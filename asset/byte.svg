<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270">
<defs>
 <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#21171D"/><stop offset=".55" stop-color="#563342"/><stop offset="1" stop-color="#8D596C"/></linearGradient>
 <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF3D1"/><stop offset="1" stop-color="#C99469"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#F3D8AE" stop-opacity=".3"/><stop offset="1" stop-color="#F3D8AE" stop-opacity="0"/></radialGradient>
</defs>
<style>
 .tw{transform-box:fill-box;transform-origin:center;animation:tw 2.6s ease-in-out infinite}
 .drift{animation:drift 10s ease-in-out infinite}
 .pulse{animation:pulse 4s ease-in-out infinite}
 .shoot{stroke:#F7DDB2;stroke-width:1.4;stroke-dasharray:2 55;animation:shoot 8s linear infinite;opacity:0}
 @keyframes tw{0%,100%{opacity:.2;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.25) rotate(18deg)}}
 @keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(20px)}}
 @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
 @keyframes shoot{0%{opacity:0;stroke-dashoffset:0}10%{opacity:.9}25%{opacity:0;stroke-dashoffset:-100}100%{opacity:0;stroke-dashoffset:-100}}
</style>
<rect width="1000" height="270" rx="22" fill="url(#night)" stroke="#C99469" stroke-width="1.8"/>
<rect x="10" y="10" width="980" height="250" rx="16" fill="none" stroke="#F1D4AC" stroke-opacity=".2"/>
<circle cx="812" cy="103" r="110" fill="url(#aura)" class="pulse"/>
<path d="M830 40a64 64 0 1 0 50 105 68 68 0 0 1-50-105" fill="url(#moon)"/>
<circle cx="850" cy="88" r="88" fill="none" stroke="#E9C18D" stroke-opacity=".35" stroke-dasharray="2 8"/>
<g fill="#F7E3B9">
 <path class="tw" d="M120 42l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/>
 <path class="tw" style="animation-delay:.8s" d="M300 170l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
 <path class="tw" style="animation-delay:1.4s" d="M690 50l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
 <path class="tw" style="animation-delay:.4s" d="M940 190l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
 <path class="tw" style="animation-delay:1.8s" d="M520 205l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
 <path class="tw" style="animation-delay:1.1s" d="M430 65l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
</g>
<g fill="#FFECCF"><circle cx="205" cy="85" r="2"/><circle cx="405" cy="50" r="2"/><circle cx="610" cy="135" r="2"/><circle cx="920" cy="55" r="2"/><circle cx="80" cy="205" r="2"/></g>
<path class="shoot" d="M580 18L460 138"/><path class="shoot" d="M210 18L115 113" style="animation-delay:4s"/>
<g class="drift" fill="none" stroke="#E8C99A" stroke-width="1.2" opacity=".65"><path d="M140 110l45 -25 38 30 42 -44 42 25"/><path d="M185 85l0 -9m38 39l7 9m42 -53l-4 -8"/></g>
<text x="480" y="116" text-anchor="middle" font-family="Georgia,serif" font-size="29" letter-spacing="4" fill="#FFF1E2">A LITTLE STARDUST, A LOT OF CODE</text>
<text x="480" y="154" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" letter-spacing="4" fill="#F2D6B2">MADE WITH CURIOSITY  ✧  BUILT WITH PURPOSE</text>
<path d="M310 184H650" stroke="#D9B477" stroke-opacity=".65"/><circle cx="300" cy="184" r="2.5" fill="#E9C18D"/><circle cx="660" cy="184" r="2.5" fill="#E9C18D"/>
</svg>